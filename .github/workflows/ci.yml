# Independent verification of anvilkit-job-codegen-team: the locked install,
# type check, Biome, build, the reviewed tools document against this build,
# the tests (a countable sidecar double, the Pi coder as a real child
# process, the coordinator over the process protocol, and the independent
# validator's real chain from the validator repository at its pinned commit),
# the protocol copy against its source, and the final Codegen Job image with
# its smoke check. Every input outside this repository is pinned here.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
env:
  # anvilkit-agent-contracts commit holding jobs/codegen/protocol.schema.json
  # and the job and component schemas the coordinator validates against:
  # the published commit of tag go/v0.1.7 (README.md).
  CONTRACTS_REF: d8fd757643bc725003116a0092e66b16df69f77a
  # anvilkit-job-codegen-supervisor commit whose sources the image builds
  # (the named build context "supervisor"): set to the published commit.
  SUPERVISOR_REF: PENDING-SUPERVISOR-COMMIT
  # anvilkit-job-validator commit of the hero fixture and the validator chain
  # the tests run (the one the image's base digest was built from).
  VALIDATOR_REF: 9ccae5a6adeb86b4e512aa6d4dc95fb610d9f500
jobs:
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ancyloce/anvilkit-agent-contracts
          ref: ${{ env.CONTRACTS_REF }}
          path: .ci/contracts
      - uses: actions/checkout@v4
        with:
          repository: ancyloce/anvilkit-job-validator
          ref: ${{ env.VALIDATOR_REF }}
          path: .ci/validator
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: npm install -g pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      # No install script runs (pnpm-workspace.yaml): better-sqlite3's addon
      # is built from its locked sources against this Node's headers.
      - run: sh tools/build-better-sqlite3.sh
      - run: pnpm run check-types
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run tools:check
      - name: the validator package and its browser for the real validation chain
        working-directory: .ci/validator
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm exec playwright install --with-deps chromium-headless-shell
      - run: pnpm run test
        env:
          ANVILKIT_CODEGEN_TEAM_CONTRACTS_DIR: ${{ github.workspace }}/.ci/contracts
          ANVILKIT_VALIDATOR_PACKAGE: ${{ github.workspace }}/.ci/validator
          ANVILKIT_REQUIRE_VALIDATOR: "1"
      # The root tests: the repair round's coder and the validator's steps as
      # UID 10001 (the real UID split; ANVILKIT_REQUIRE_ROOT_TESTS turns a
      # skip into a failure).
      - name: tests as root (the coder and the validator's steps as UID 10001)
        run: sudo --preserve-env=ANVILKIT_CODEGEN_TEAM_CONTRACTS_DIR,ANVILKIT_VALIDATOR_PACKAGE,ANVILKIT_REQUIRE_VALIDATOR env "PATH=$PATH" ANVILKIT_REQUIRE_ROOT_TESTS=1 pnpm exec vitest run test/prior.test.ts test/validation.test.ts -t root
        env:
          ANVILKIT_CODEGEN_TEAM_CONTRACTS_DIR: ${{ github.workspace }}/.ci/contracts
          ANVILKIT_VALIDATOR_PACKAGE: ${{ github.workspace }}/.ci/validator
          ANVILKIT_REQUIRE_VALIDATOR: "1"
  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ancyloce/anvilkit-agent-contracts
          ref: ${{ env.CONTRACTS_REF }}
          path: .ci/contracts
      - run: sh tools/sync-protocol.sh --check .ci/contracts
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ancyloce/anvilkit-job-codegen-supervisor
          ref: ${{ env.SUPERVISOR_REF }}
          path: .ci/supervisor
      # The validator base is pulled by the digest the Dockerfile pins, from
      # the registry its VALIDATOR_REPOSITORY default names.
      - run: docker build --build-context supervisor=.ci/supervisor -t anvilkit-codegen-team:ci .
      - run: sh tools/image-smoke.sh anvilkit-codegen-team:ci
