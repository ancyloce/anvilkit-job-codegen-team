# This directory is its own pnpm workspace root (one package), independent of
# the parent's workspace globs, as jobs/validator and the Model Proxy are: the
# lockfile here pins the Pi coding SDK (the same @earendil-works/pi-ai 0.85.1
# the Proxy inspects), LangGraph.js with its SQLite checkpoint saver, and the
# toolchain of the trusted coordinator.
packages: []
# Lifecycle scripts: none runs on this trusted side. better-sqlite3's install
# script would fetch a prebuilt native binary from the network at install
# time (prebuild-install); its addon (the SqliteSaver of the checkpointer
# needs it) is built from the locked package's own sources by
# tools/build-better-sqlite3.sh after the install instead — in the image's
# build stage, in CI and on a development checkout. esbuild's postinstall
# only fetches a platform binary when its optional platform package is
# absent (it is present); @google/genai (a pi-ai provider path this build
# never enables) has a no-op preinstall echo; protobufjs (a transitive of the
# Google provider path) only prints a notice.
allowBuilds:
  better-sqlite3: false
  '@google/genai': false
  esbuild: false
  protobufjs: false
# better-sqlite3 13 (node-addon-api, the stable N-API ABI) replaces 12 for the
# checkpointer too (@langchain/langgraph-checkpoint-sqlite 1.0.4 asks for
# ^12.10.0): 12's ObjectWrap addon built against Node 24.19's headers registers
# environment cleanup hooks that abort the process when a statement is
# collected without a current Node context (nodejs/node#63923, not yet fixed
# in a v24 release) — intermittently in the coordinator and the tests.
overrides:
  better-sqlite3: 13.0.3
